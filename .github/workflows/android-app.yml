# Builds the 天玉堂 Staff Android app (mobile/) into an installable APK.
#
#   Actions → "Android staff app" → Run workflow → enter the site address
#   (e.g. https://www.tianyutang.org). When it finishes, download
#   "tianyutang-staff-apk" at the bottom of the run page.
#
# Pushes and pull requests that touch mobile/ also build it, as a check.
# Optional signing (so a new APK installs over the old one): add the
# repository secrets described in mobile/README.md.
name: Android staff app

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Site address the app opens (https://…)"
        required: true
  push:
    paths: ["mobile/**", ".github/workflows/android-app.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/android-app.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Site address
        env:
          INPUT_URL: ${{ inputs.site_url }}
          VAR_URL: ${{ vars.TYT_SITE_URL }}
        run: |
          url="${INPUT_URL:-$VAR_URL}"
          url="${url:-https://tianyutang.example}"
          case "$url" in
            https://*|http://*) ;;
            *) echo "::error::Site address must start with https:// (or http:// for local testing)"; exit 1 ;;
          esac
          echo "TYT_SITE_URL=${url%/}" >> "$GITHUB_ENV"
          echo "Building for ${url%/}"

      - name: Install and sync
        run: |
          npm ci --no-audit --no-fund
          npx cap sync android

      - name: Signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.TYT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/tyt.jks"
            echo "TYT_KEYSTORE=$RUNNER_TEMP/tyt.jks" >> "$GITHUB_ENV"
            echo "Signing with the team key"
          else
            echo "No TYT_KEYSTORE_BASE64 secret: signing with a throw-away debug key"
          fi

      - name: Build APK
        working-directory: mobile/android
        env:
          TYT_KEYSTORE_PASSWORD: ${{ secrets.TYT_KEYSTORE_PASSWORD }}
          TYT_KEY_ALIAS: ${{ secrets.TYT_KEY_ALIAS }}
          TYT_KEY_PASSWORD: ${{ secrets.TYT_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug -PtytVersionCode=${{ github.run_number }}
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/tianyutang-staff.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: tianyutang-staff-apk
          path: tianyutang-staff.apk
          retention-days: 30
