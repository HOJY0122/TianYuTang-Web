# Builds the 天玉堂 Staff Android app (mobile/) into an installable APK.
# Manual only: Actions → "Android staff app" → Run workflow, then download
# "tianyutang-staff-apk" from the run page. The APK asks for the site
# address on first launch, so one build serves every site.
# (The usual way is Android Studio — see mobile/README.md.)
name: Android staff app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install and sync
        run: |
          npm ci --no-audit --no-fund
          npx cap sync android

      - name: Signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.TYT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/tyt.jks"
            echo "TYT_KEYSTORE=$RUNNER_TEMP/tyt.jks" >> "$GITHUB_ENV"
            echo "Signing with the team key"
          else
            echo "No TYT_KEYSTORE_BASE64 secret: signing with a throw-away debug key"
          fi

      - name: Build APK
        working-directory: mobile/android
        env:
          TYT_KEYSTORE_PASSWORD: ${{ secrets.TYT_KEYSTORE_PASSWORD }}
          TYT_KEY_ALIAS: ${{ secrets.TYT_KEY_ALIAS }}
          TYT_KEY_PASSWORD: ${{ secrets.TYT_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug -PtytVersionCode=${{ github.run_number }}
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/tianyutang-staff.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: tianyutang-staff-apk
          path: tianyutang-staff.apk
          retention-days: 30
