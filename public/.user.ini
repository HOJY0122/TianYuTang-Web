; PHP limits for this site (PHP-FPM / CGI read this file; Apache with
; mod_php uses the same values from .htaccess). Bulk uploads send one or a
; few pictures per request, so these are per-request ceilings, not batch
; sizes. Nginx also needs:  client_max_body_size 64M;
upload_max_filesize = 20M
post_max_size = 64M
max_file_uploads = 60
memory_limit = 512M
max_execution_time = 240
